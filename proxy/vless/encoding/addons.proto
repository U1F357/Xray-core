syntax = "proto3";

package xray.proxy.vless.encoding;
option csharp_namespace = "Xray.Proxy.Vless.Encoding";
option go_package = "github.com/xtls/xray-core/proxy/vless/encoding";
option java_package = "com.xray.proxy.vless.encoding";
option java_multiple_files = true;

message Addons {
  string Flow = 1;
  bytes Seed = 2;
  // Private experimental extension; not allocated or standardized by upstream.
  bytes tcp_fingerprint = 65001;
  // Independent extension so older fingerprint-aware peers retain the OS category.
  bytes tcp_ecn = 65002;
  bytes tcp_rtt = 65003; // Initial ingress RTT in a private versioned envelope.
}
